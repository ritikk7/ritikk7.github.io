<div class="work-experience">
    {% if include.detail_ready %}
        <a href="{{ include.url | relative_url }}" class="company-logo" aria-label="Read about {{ include.title }}">
            <img src="{{ include.logo | relative_url }}" alt="{{ include.title }} logo" />
        </a>
    {% else %}
        <span class="company-logo">
            <img src="{{ include.logo | relative_url }}" alt="{{ include.title }} logo" />
        </span>
    {% endif %}
    <h3>{{ include.position }}</h3>
    <p>{{ include.time_worked }}</p>

    <div class="skills">
        {% for skill in include.skills %}
        <a href="{{ skill.url }}" class="skill-btn">{{ skill.name }}</a>
        {% endfor %}
    </div>
</div>
