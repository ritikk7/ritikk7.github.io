<nav class="{% if page.nav_key == "home" %}nav-home{% else %}nav{% endif %}">
    <ul class="list">
        {% for item in site.data.navigation %}
        {% if item.visible and page.nav_key != item.key %}
            <li class="item">
                <a class="link" href="{{ item.url | relative_url }}">{% if item.keep_together %}{{ item.label | replace: " ", "&nbsp;" }}{% else %}{{ item.label }}{% endif %}</a>
            </li>
        {% endif %}
        {% endfor %}
    </ul>
</nav>
