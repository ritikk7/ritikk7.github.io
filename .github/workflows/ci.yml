name: Site verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: site-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JEKYLL_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter

      - name: Verify generated site
        run: bundle exec ruby script/verify_site.rb _site

      - name: Build reference drafts
        run: bundle exec jekyll build --drafts --destination _site-drafts --strict_front_matter

      - name: Verify reference drafts
        run: bundle exec ruby script/verify_site.rb _site-drafts --allow-drafts
